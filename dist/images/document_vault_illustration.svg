<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF9"/>
      <stop offset="100%" stop-color="#EBF4EE"/>
    </linearGradient>
    <linearGradient id="dvCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFEFE"/>
    </linearGradient>
    <filter id="dvShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#194632" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#dvBg)"/>
  
  <g stroke="#DFE5E0" stroke-width="1" opacity="0.35">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="530" x2="800" y2="530"/>
  </g>
  <ellipse cx="400" cy="520" rx="340" ry="22" fill="#245C45" opacity="0.06"/>

  <g transform="translate(80, 80)" filter="url(#dvShadow)">
    <rect x="0" y="0" width="640" height="420" rx="14" fill="url(#dvCard)" stroke="#DFE5E0" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="640" height="60" rx="14" fill="#245C45"/>
    <rect x="0" y="48" width="640" height="12" fill="#245C45"/>
    
    <text x="30" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">STRUCTURED DOCUMENT ARCHIVE &amp; INDEXING</text>
    <rect x="520" y="18" width="90" height="24" rx="12" fill="#E3EFE7"/>
    <text x="565" y="34" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#245C45" text-anchor="middle">ENCRYPTED</text>

    <!-- Content: 3-column structured folder system -->
    <g transform="translate(30, 84)">
      <!-- Folder Category 1: Banking & Statements -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="290" rx="8" fill="#F8FAF9" stroke="#DFE5E0"/>
        <!-- Folder Tab -->
        <path d="M 0 8 Q 0 0 8 0 L 80 0 Q 90 0 95 10 L 105 16 L 172 16 Q 180 16 180 24 L 180 40 L 0 40 Z" fill="#245C45"/>
        <text x="14" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Bank &amp; Ledgers</text>

        <!-- Folder content list -->
        <g transform="translate(14, 52)">
          <rect x="0" y="0" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">Current Account (SBI)</text>
          <text x="10" y="31" font-family="monospace" font-size="8" fill="#66736B">12/12 Months Reconciled</text>

          <rect x="0" y="50" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="67" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">Loan Account (HDFC)</text>
          <text x="10" y="81" font-family="monospace" font-size="8" fill="#66736B">Interest Certificates Indexed</text>

          <rect x="0" y="100" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="117" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">Credit Card Statements</text>
          <text x="10" y="131" font-family="monospace" font-size="8" fill="#66736B">Expenses Categorized</text>

          <rect x="0" y="150" width="152" height="60" rx="4" fill="#E3EFE7"/>
          <text x="10" y="168" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#245C45">VERIFIED BALANCE</text>
          <text x="10" y="184" font-family="system-ui, sans-serif" font-size="8" fill="#26332D">Opening &amp; closing balances matched with zero variance.</text>
        </g>
      </g>

      <!-- Folder Category 2: Tax Invoices & Challans -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="180" height="290" rx="8" fill="#F8FAF9" stroke="#DFE5E0"/>
        <!-- Folder Tab -->
        <path d="M 0 8 Q 0 0 8 0 L 80 0 Q 90 0 95 10 L 105 16 L 172 16 Q 180 16 180 24 L 180 40 L 0 40 Z" fill="#245C45"/>
        <text x="14" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Tax Vouchers</text>

        <!-- Folder content list -->
        <g transform="translate(14, 52)">
          <rect x="0" y="0" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">Sales Invoices Register</text>
          <text x="10" y="31" font-family="monospace" font-size="8" fill="#66736B">HSN &amp; GSTIN Tagged</text>

          <rect x="0" y="50" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="67" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">Purchase Bills (ITC 2B)</text>
          <text x="10" y="81" font-family="monospace" font-size="8" fill="#66736B">Supplier Matched</text>

          <rect x="0" y="100" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="117" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">Challan Receipts (CPIN)</text>
          <text x="10" y="131" font-family="monospace" font-size="8" fill="#66736B">PMT-06 &amp; ITNS 281</text>

          <rect x="0" y="150" width="152" height="60" rx="4" fill="#E3EFE7"/>
          <text x="10" y="168" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#245C45">ITC RECONCILIATION</text>
          <text x="10" y="184" font-family="system-ui, sans-serif" font-size="8" fill="#26332D">Supplier tax invoices cross-referenced with GSTR-2B.</text>
        </g>
      </g>

      <!-- Folder Category 3: Statutory Filings & Acknowledgments -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="180" height="290" rx="8" fill="#F8FAF9" stroke="#DFE5E0"/>
        <!-- Folder Tab -->
        <path d="M 0 8 Q 0 0 8 0 L 80 0 Q 90 0 95 10 L 105 16 L 172 16 Q 180 16 180 24 L 180 40 L 0 40 Z" fill="#245C45"/>
        <text x="14" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Filed Returns</text>

        <!-- Folder content list -->
        <g transform="translate(14, 52)">
          <rect x="0" y="0" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">GSTR-3B Acknowledgments</text>
          <text x="10" y="31" font-family="monospace" font-size="8" fill="#66736B">ARN Generated &amp; Saved</text>

          <rect x="0" y="50" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="67" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">ITR-V Acknowledgments</text>
          <text x="10" y="81" font-family="monospace" font-size="8" fill="#66736B">AY 2024–25 Verified</text>

          <rect x="0" y="100" width="152" height="42" rx="4" fill="#FFFFFF" stroke="#DFE5E0"/>
          <text x="10" y="117" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#26332D">TDS Form 16 / 16A</text>
          <text x="10" y="131" font-family="monospace" font-size="8" fill="#66736B">TRACES Generated</text>

          <rect x="0" y="150" width="152" height="60" rx="4" fill="#E3EFE7"/>
          <text x="10" y="168" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#245C45">AUDIT READINESS</text>
          <text x="10" y="184" font-family="system-ui, sans-serif" font-size="8" fill="#26332D">All filing receipts backed up with instant retrieval.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
